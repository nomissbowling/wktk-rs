[package]
name = "wktk"
version = "0.0.1" # change with html_root_url in lib.rs
edition = "2024"
authors = ["nomissbowling <nomissbowling@yahoo.co.jp>"]

description = "tcl/tk worker for Rust rstk"
keywords = ["rstk", "tcl", "tk", "https", "network"]
categories = ["gui", "graphics", "external-ffi-bindings"]
license = "MIT"

documentation = "https://docs.rs/wktk/"
homepage = "https://crates.io/crates/wktk"
repository = "https://github.com/nomissbowling/wktk-rs"

readme = "README.md"

#build = "build.rs"

[lib]
name = "wktk"

[dependencies]
rstk = { version = "=0.3.0" }

thiserror = { version = "=2.0.20" }
anyhow = { version = "=1.0.104" }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
